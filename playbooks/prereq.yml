---
- name: System prerequisites for Kubernetes
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Disable Swap (current session)
      command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Disable Swap permanently (fstab)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

- name: Raspberry Pi specific configuration (cgroups)
  hosts: k3s_workers
  become: true
  tasks:
    - name: Check if cmdline.txt exists
      stat:
        path: /boot/cmdline.txt
      register: cmdline_file

    - name: Enable cgroups for memory in /boot/cmdline.txt
      replace:
        path: /boot/cmdline.txt
        regexp: '^([\w](?!.*\bcgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1\b).*)$'
        replace: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
      when: cmdline_file.stat.exists
      notify: Reboot Raspberry Pi

  handlers:
    - name: Reboot Raspberry Pi
      reboot:
