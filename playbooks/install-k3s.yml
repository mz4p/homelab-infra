---
- name: Bootstrap K3s Master Node
  hosts: k3s_master
  become: true
  tasks:
    - name: Install K3s Server
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token to become available
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token

    - name: Read node-token from Master
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token_base64

    - name: Store decoded token as fact
      set_fact:
        k3s_token: "{{ token_base64['content'] | b64decode | trim }}"

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ~/.kube/config
        flat: yes

- name: Provision K3s Worker Nodes
  hosts: k3s_workers
  become: true
  tasks:
    - name: Install K3s Agent and join cluster
      shell: "curl -sfL https://get.k3s.io | K3S_URL=https://{{ hostvars[groups['k3s_master'][0]]['inventory_hostname'] }}:6443 K3S_TOKEN={{ hostvars[groups['k3s_master'][0]]['k3s_token'] }} sh -"
      args:
        creates: /usr/local/bin/k3s-agent

- name: Configure local kubeconfig context
  hosts: localhost
  connection: local
  vars:
    master_ip: "{{ hostvars[groups['k3s_master'][0]]['inventory_hostname'] }}"
  tasks:
    - name: Update Master IP in local kubeconfig
      replace:
        path: ~/.kube/config
        regexp: '127.0.0.1'
        replace: "{{ master_ip }}"
